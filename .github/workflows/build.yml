name: build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '25', '26' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and run the test suite
        run: mvn -B -ntp clean verify

      - name: Verify the artifact targets Java 25 bytecode
        run: |
          python3 - <<'PY'
          import collections, sys, zipfile
          path = 'lightlogin-paper/target/lightlogin-paper-2.0.0.jar'
          z = zipfile.ZipFile(path)
          own = [n for n in z.namelist()
                 if n.endswith('.class') and n.startswith('dev/lightlogin/')
                 and not n.startswith('dev/lightlogin/libs/')]
          majors = collections.Counter(((z.read(n)[6] << 8) | z.read(n)[7]) for n in own)
          print(len(own), 'own classes, class-file majors:', dict(majors))
          if set(majors) != {69}:
              sys.exit('unexpected bytecode target: expected only major 69 (Java 25)')
          PY

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: lightlogin-paper-jdk${{ matrix.java }}
          path: lightlogin-paper/target/lightlogin-paper-*.jar
          if-no-files-found: error